<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="foodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1815"/>
      <stop offset="50%" stop-color="#142b25"/>
      <stop offset="100%" stop-color="#08100e"/>
    </linearGradient>
    <linearGradient id="roseEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="fdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#foodBg)"/>
  
  <circle cx="200" cy="150" r="140" fill="#10b981" opacity="0.14" filter="url(#fdGlow)"/>
  <circle cx="620" cy="280" r="160" fill="#06b6d4" opacity="0.12" filter="url(#fdGlow)"/>

  <!-- Window Container -->
  <rect x="80" y="55" width="640" height="340" rx="16" fill="rgba(14, 28, 24, 0.88)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5"/>
  
  <!-- Header -->
  <rect x="80" y="55" width="640" height="42" rx="16" fill="rgba(20, 42, 36, 0.7)"/>
  <circle cx="110" cy="76" r="6" fill="#ef4444"/>
  <circle cx="130" cy="76" r="6" fill="#f59e0b"/>
  <circle cx="150" cy="76" r="6" fill="#10b981"/>
  <text x="400" y="81" fill="#34d399" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Food Donation App &bull; Community Hunger Relief Network &bull; Vercel Deployed</text>

  <!-- Left Listing Form Mockup -->
  <g transform="translate(105, 115)">
    <rect x="0" y="0" width="280" height="255" rx="10" fill="rgba(20, 42, 36, 0.5)" stroke="rgba(255, 255, 255, 0.05)"/>
    <text x="18" y="28" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Surplus Food Donation Dispatch</text>
    <rect x="18" y="44" width="244" height="32" rx="6" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(16, 185, 129, 0.2)"/>
    <text x="28" y="65" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Donor: Grand Banquet Hall, Chennai</text>
    
    <rect x="18" y="86" width="244" height="32" rx="6" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(16, 185, 129, 0.2)"/>
    <text x="28" y="107" fill="#34d399" font-family="'Inter', sans-serif" font-size="11">Food Type: Packaged Meals (180 servings)</text>

    <rect x="18" y="128" width="244" height="32" rx="6" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(16, 185, 129, 0.2)"/>
    <text x="28" y="149" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Prepared: 2 hrs ago &bull; Safe Temp</text>

    <rect x="18" y="195" width="244" height="42" rx="8" fill="url(#roseEmerald)"/>
    <text x="140" y="221" fill="#fff" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Broadcast to Local Shelters &#10140;</text>
  </g>

  <!-- Right: Volunteer Dispatch & Impact -->
  <g transform="translate(405, 115)">
    <rect x="0" y="0" width="290" height="255" rx="10" fill="rgba(20, 42, 36, 0.5)" stroke="rgba(255, 255, 255, 0.05)"/>
    
    <text x="18" y="28" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Live Volunteer Match</text>
    <rect x="18" y="44" width="254" height="60" rx="8" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.25)"/>
    <text x="30" y="68" fill="#34d399" font-family="'Inter', sans-serif" font-size="12" font-weight="700">&#10004; NGO Volunteer En Route</text>
    <text x="30" y="88" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">ETA: 14 mins &bull; Vehicle: Temperature Insulated</text>

    <!-- Impact Counter -->
    <text x="18" y="138" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Community Impact Ledger</text>
    <rect x="18" y="152" width="120" height="85" rx="8" fill="rgba(0,0,0,0.3)"/>
    <text x="30" y="180" fill="#22d3ee" font-family="'Inter', sans-serif" font-size="22" font-weight="800">4,200+</text>
    <text x="30" y="202" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Meals Saved</text>
    <text x="30" y="222" fill="#34d399" font-family="'Inter', sans-serif" font-size="9">From Landfill</text>

    <rect x="152" y="152" width="120" height="85" rx="8" fill="rgba(0,0,0,0.3)"/>
    <text x="164" y="180" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="22" font-weight="800">18</text>
    <text x="164" y="202" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Partner Shelters</text>
    <text x="164" y="222" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="9">Across Chennai</text>
  </g>
</svg>
