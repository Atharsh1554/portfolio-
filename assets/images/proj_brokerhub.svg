<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05131e"/>
      <stop offset="50%" stop-color="#0a2233"/>
      <stop offset="100%" stop-color="#030c14"/>
    </linearGradient>
    <linearGradient id="emeraldCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="bhGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bhBg)"/>
  
  <circle cx="180" cy="150" r="140" fill="#10b981" opacity="0.12" filter="url(#bhGlow)"/>
  <circle cx="640" cy="300" r="160" fill="#06b6d4" opacity="0.15" filter="url(#bhGlow)"/>

  <!-- Window Container -->
  <rect x="80" y="55" width="640" height="340" rx="16" fill="rgba(11, 23, 38, 0.88)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5"/>
  
  <!-- Header -->
  <rect x="80" y="55" width="640" height="42" rx="16" fill="rgba(15, 32, 53, 0.7)"/>
  <circle cx="110" cy="76" r="6" fill="#ef4444"/>
  <circle cx="130" cy="76" r="6" fill="#f59e0b"/>
  <circle cx="150" cy="76" r="6" fill="#10b981"/>
  <text x="400" y="81" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">BrokerHub &bull; Enterprise Admin Control Center &bull; hendrixbrokerhub.in</text>

  <!-- Left Stats & Telemetry -->
  <g transform="translate(105, 115)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="135" height="60" rx="8" fill="rgba(16, 185, 129, 0.08)" stroke="rgba(16, 185, 129, 0.2)"/>
    <text x="14" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Active Brokers</text>
    <text x="14" y="48" fill="#10b981" font-family="'Inter', sans-serif" font-size="18" font-weight="800">1,248</text>

    <!-- Metric 2 -->
    <rect x="150" y="0" width="135" height="60" rx="8" fill="rgba(6, 182, 212, 0.08)" stroke="rgba(6, 182, 212, 0.2)"/>
    <text x="164" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Verified Leads</text>
    <text x="164" y="48" fill="#22d3ee" font-family="'Inter', sans-serif" font-size="18" font-weight="800">8,920</text>

    <!-- Metric 3 -->
    <rect x="295" y="0" width="135" height="60" rx="8" fill="rgba(139, 92, 246, 0.08)" stroke="rgba(139, 92, 246, 0.2)"/>
    <text x="309" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Escrow Settled</text>
    <text x="309" y="48" fill="#c084fc" font-family="'Inter', sans-serif" font-size="18" font-weight="800">&#8377; 42.6M</text>

    <!-- Metric 4 -->
    <rect x="440" y="0" width="150" height="60" rx="8" fill="rgba(245, 158, 11, 0.08)" stroke="rgba(245, 158, 11, 0.2)"/>
    <text x="454" y="24" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">System Health</text>
    <text x="454" y="48" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="18" font-weight="800">99.98% OK</text>
  </g>

  <!-- Main Workflow Table Mockup -->
  <g transform="translate(105, 190)">
    <rect x="0" y="0" width="590" height="180" rx="10" fill="rgba(15, 32, 53, 0.5)" stroke="rgba(255, 255, 255, 0.06)"/>
    
    <!-- Table Header -->
    <rect x="0" y="0" width="590" height="34" rx="10" fill="rgba(255, 255, 255, 0.04)"/>
    <text x="20" y="22" fill="#64748b" font-family="'Inter', sans-serif" font-size="11" font-weight="700">BROKER ID</text>
    <text x="140" y="22" fill="#64748b" font-family="'Inter', sans-serif" font-size="11" font-weight="700">PORTAL / DOMAIN</text>
    <text x="300" y="22" fill="#64748b" font-family="'Inter', sans-serif" font-size="11" font-weight="700">ACCREDITATION</text>
    <text x="460" y="22" fill="#64748b" font-family="'Inter', sans-serif" font-size="11" font-weight="700">ACTION</text>

    <!-- Row 1 -->
    <text x="20" y="62" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">BRK-78401</text>
    <text x="140" y="62" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Chennai Real-Estate</text>
    <rect x="300" y="47" width="90" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="345" y="62" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">VERIFIED</text>
    <rect x="460" y="47" width="80" height="22" rx="6" fill="url(#emeraldCyan)"/>
    <text x="500" y="62" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Manage &#8594;</text>

    <!-- Row 2 -->
    <text x="20" y="102" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">BRK-99234</text>
    <text x="140" y="102" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Bangalore Tech Infra</text>
    <rect x="300" y="87" width="90" height="22" rx="11" fill="rgba(6, 182, 212, 0.15)"/>
    <text x="345" y="102" fill="#22d3ee" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">IN AUDIT</text>
    <rect x="460" y="87" width="80" height="22" rx="6" fill="rgba(255,255,255,0.08)"/>
    <text x="500" y="102" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Review</text>

    <!-- Row 3 -->
    <text x="20" y="142" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">BRK-33108</text>
    <text x="140" y="142" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Agri-Commodities Direct</text>
    <rect x="300" y="127" width="90" height="22" rx="11" fill="rgba(16, 185, 129, 0.15)"/>
    <text x="345" y="142" fill="#34d399" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">VERIFIED</text>
    <rect x="460" y="127" width="80" height="22" rx="6" fill="url(#emeraldCyan)"/>
    <text x="500" y="142" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">Manage &#8594;</text>
  </g>
</svg>
