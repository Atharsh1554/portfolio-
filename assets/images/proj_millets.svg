<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="milletBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f06"/>
      <stop offset="50%" stop-color="#261b0c"/>
      <stop offset="100%" stop-color="#0d0a04"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#milletBg)"/>
  
  <circle cx="200" cy="150" r="140" fill="#f59e0b" opacity="0.12" filter="url(#mGlow)"/>
  <circle cx="620" cy="280" r="150" fill="#10b981" opacity="0.14" filter="url(#mGlow)"/>

  <!-- Window Container -->
  <rect x="80" y="55" width="640" height="340" rx="16" fill="rgba(24, 18, 10, 0.88)" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1.5"/>
  
  <!-- Header -->
  <rect x="80" y="55" width="640" height="42" rx="16" fill="rgba(38, 28, 16, 0.7)"/>
  <circle cx="110" cy="76" r="6" fill="#ef4444"/>
  <circle cx="130" cy="76" r="6" fill="#f59e0b"/>
  <circle cx="150" cy="76" r="6" fill="#10b981"/>
  <text x="400" y="81" fill="#fbbf24" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Millet Market &bull; Farmer-Harvest Procurement &amp; Marketplace &bull; Prisma + Next.js</text>

  <!-- Flow Visualizer -->
  <g transform="translate(105, 120)">
    <rect x="0" y="0" width="590" height="85" rx="10" fill="rgba(38, 28, 16, 0.6)" stroke="rgba(255, 255, 255, 0.05)"/>
    <text x="20" y="24" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="11" font-weight="700">PROCUREMENT PIPELINE</text>
    
    <!-- Steps -->
    <text x="20" y="56" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="700">1. Harvest Submission</text>
    <text x="160" y="56" fill="#64748b" font-family="'Inter', sans-serif" font-size="12">&#8594;</text>
    <text x="180" y="56" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="700">2. Physical Inspection</text>
    <text x="325" y="56" fill="#64748b" font-family="'Inter', sans-serif" font-size="12">&#8594;</text>
    <text x="345" y="56" fill="#34d399" font-family="'Inter', sans-serif" font-size="12" font-weight="700">3. Procure to Inventory</text>
    <text x="500" y="56" fill="#64748b" font-family="'Inter', sans-serif" font-size="12">&#8594;</text>
    <text x="520" y="56" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Payout</text>
  </g>

  <!-- Product & Ledger Cards -->
  <g transform="translate(105, 220)">
    <!-- Product 1 -->
    <rect x="0" y="0" width="185" height="150" rx="10" fill="rgba(38, 28, 16, 0.5)" stroke="rgba(255, 255, 255, 0.05)"/>
    <rect x="15" y="15" width="155" height="60" rx="6" fill="rgba(245, 158, 11, 0.1)"/>
    <text x="92" y="50" fill="#f59e0b" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">&#127806; Finger Millet (Ragi)</text>
    <text x="15" y="98" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Procured: 2,400 kg</text>
    <text x="15" y="118" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Farmer Rate: &#8377; 42/kg</text>
    <text x="15" y="136" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">Quality Grade: A+ Direct</text>

    <!-- Product 2 -->
    <rect x="202" y="0" width="185" height="150" rx="10" fill="rgba(38, 28, 16, 0.5)" stroke="rgba(255, 255, 255, 0.05)"/>
    <rect x="15" y="15" width="155" height="60" rx="6" fill="rgba(16, 185, 129, 0.1)"/>
    <text x="92" y="50" fill="#10b981" font-family="'Inter', sans-serif" font-size="14" font-weight="700" text-anchor="middle">&#127806; Foxtail Millet (Thinai)</text>
    <text x="15" y="98" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Procured: 1,850 kg</text>
    <text x="15" y="118" fill="#10b981" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Farmer Rate: &#8377; 58/kg</text>
    <text x="15" y="136" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">Physical Sample Verified</text>

    <!-- Payout Ledger Card -->
    <rect x="405" y="0" width="185" height="150" rx="10" fill="rgba(38, 28, 16, 0.5)" stroke="rgba(255, 255, 255, 0.05)"/>
    <text x="15" y="26" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="11" font-weight="700">FARMER PAYOUT LEDGER</text>
    <text x="15" y="50" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Direct Bank Transfers</text>
    <text x="15" y="80" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="20" font-weight="800">&#8377; 1,84,200</text>
    <text x="15" y="102" fill="#34d399" font-family="'Inter', sans-serif" font-size="10">&bull; 100% Payouts Disbursed</text>
    <rect x="15" y="115" width="155" height="25" rx="6" fill="url(#amberGrad)"/>
    <text x="92" y="132" fill="#fff" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">View Marketplace &#8594;</text>
  </g>
</svg>
