<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="forensicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e071c"/>
      <stop offset="50%" stop-color="#190e33"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#forensicBg)"/>
  
  <circle cx="220" cy="160" r="150" fill="#a855f7" opacity="0.14" filter="url(#fGlow)"/>
  <circle cx="620" cy="290" r="160" fill="#06b6d4" opacity="0.12" filter="url(#fGlow)"/>

  <!-- Window Container -->
  <rect x="80" y="55" width="640" height="340" rx="16" fill="rgba(18, 12, 38, 0.9)" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1.5"/>
  
  <!-- Header -->
  <rect x="80" y="55" width="640" height="42" rx="16" fill="rgba(28, 18, 56, 0.7)"/>
  <circle cx="110" cy="76" r="6" fill="#ef4444"/>
  <circle cx="130" cy="76" r="6" fill="#f59e0b"/>
  <circle cx="150" cy="76" r="6" fill="#10b981"/>
  <text x="400" y="81" fill="#c084fc" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">ForenSight &bull; Multimodal AI Forensic Visualization &bull; FastAPI + Next.js</text>

  <!-- Left: Eyewitness Testimony Ingestion -->
  <g transform="translate(105, 115)">
    <rect x="0" y="0" width="280" height="255" rx="10" fill="rgba(30, 20, 60, 0.5)" stroke="rgba(255, 255, 255, 0.06)"/>
    <text x="18" y="28" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Eyewitness Testimony Prompt</text>
    <rect x="18" y="42" width="244" height="95" rx="6" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(168, 85, 247, 0.2)"/>
    <text x="28" y="64" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="11">"Male, approx 6'1, angular jawline,</text>
    <text x="28" y="82" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="11">dark textured coat, fleeing eastbound</text>
    <text x="28" y="100" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="11">near industrial alley intersection..."</text>

    <!-- AI Feature Extraction -->
    <rect x="18" y="152" width="244" height="40" rx="6" fill="rgba(168, 85, 247, 0.1)"/>
    <text x="28" y="176" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">&bull; Facial Landmark Vectors Generated</text>

    <rect x="18" y="202" width="244" height="40" rx="6" fill="url(#aiGrad)"/>
    <text x="140" y="227" fill="#fff" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Synthesize Multimodal Output &#9889;</text>
  </g>

  <!-- Right: Facial Sketch & Crime Scene Layout Reconstruction -->
  <g transform="translate(405, 115)">
    <rect x="0" y="0" width="290" height="255" rx="10" fill="rgba(30, 20, 60, 0.5)" stroke="rgba(255, 255, 255, 0.06)"/>
    
    <!-- Top Half: Suspect Facial Mesh -->
    <text x="18" y="28" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Suspect Biometric Reconstruction</text>
    <rect x="18" y="40" width="254" height="110" rx="8" fill="rgba(0, 0, 0, 0.5)" stroke="rgba(6, 182, 212, 0.3)"/>
    <!-- Wireframe Face Sketch Mockup -->
    <circle cx="145" cy="85" r="32" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="130" y1="80" x2="140" y2="80" stroke="#a855f7" stroke-width="2"/>
    <line x1="150" y1="80" x2="160" y2="80" stroke="#a855f7" stroke-width="2"/>
    <path d="M 140 100 Q 145 106 150 100" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <text x="145" y="136" fill="#64748b" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Confidence Score: 94.8% &bull; Pytest Verified</text>

    <!-- Bottom Half: Scene Coordinate Layout -->
    <text x="18" y="175" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="700">Crime Scene Coordinate Mapping</text>
    <rect x="18" y="188" width="254" height="54" rx="6" fill="rgba(0,0,0,0.4)"/>
    <line x1="30" y1="215" x2="260" y2="215" stroke="#475569" stroke-width="1"/>
    <circle cx="70" cy="215" r="5" fill="#ef4444"/>
    <text x="70" y="235" fill="#f87171" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Point of Entry</text>
    <circle cx="210" cy="215" r="5" fill="#34d399"/>
    <text x="210" y="235" fill="#34d399" font-family="'Inter', sans-serif" font-size="9" text-anchor="middle">Exit Trajectory</text>
  </g>
</svg>
