<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="50%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="violetCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="130" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>
  <circle cx="650" cy="300" r="160" fill="#8b5cf6" opacity="0.15" filter="url(#glow)"/>

  <!-- Grid overlay -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
  </g>

  <!-- App Window Container -->
  <rect x="90" y="60" width="620" height="330" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="90" y="60" width="620" height="44" rx="16" fill="rgba(30, 41, 59, 0.6)"/>
  <circle cx="120" cy="82" r="6" fill="#ef4444"/>
  <circle cx="140" cy="82" r="6" fill="#f59e0b"/>
  <circle cx="160" cy="82" r="6" fill="#10b981"/>
  <text x="400" y="87" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">GROOMER — Live Appointment Slot System</text>

  <!-- Left Sidebar Mockup -->
  <rect x="110" y="125" width="160" height="240" rx="10" fill="rgba(30, 41, 59, 0.4)" stroke="rgba(255, 255, 255, 0.05)"/>
  <text x="125" y="155" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Services</text>
  <rect x="125" y="170" width="130" height="32" rx="6" fill="url(#violetCyan)" opacity="0.25"/>
  <text x="135" y="191" fill="#22d3ee" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Haircut &amp; Styling</text>
  <rect x="125" y="212" width="130" height="32" rx="6" fill="rgba(255,255,255,0.03)"/>
  <text x="135" y="233" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Beard Grooming</text>
  <rect x="125" y="254" width="130" height="32" rx="6" fill="rgba(255,255,255,0.03)"/>
  <text x="135" y="275" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Spa &amp; Treatment</text>

  <!-- Main Slot Booking Grid -->
  <rect x="290" y="125" width="400" height="240" rx="10" fill="rgba(30, 41, 59, 0.3)" stroke="rgba(255, 255, 255, 0.05)"/>
  <text x="310" y="155" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Available Reservation Slots</text>
  <text x="310" y="175" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Select your preferred time block</text>

  <!-- Slots -->
  <!-- Row 1 -->
  <rect x="310" y="195" width="115" height="42" rx="8" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="367" y="221" fill="#34d399" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">10:00 AM</text>

  <rect x="435" y="195" width="115" height="42" rx="8" fill="url(#violetCyan)" opacity="0.9"/>
  <text x="492" y="221" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">11:30 AM (Selected)</text>

  <rect x="560" y="195" width="115" height="42" rx="8" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="1"/>
  <text x="617" y="221" fill="#f87171" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">01:00 PM (Booked)</text>

  <!-- Row 2 -->
  <rect x="310" y="250" width="115" height="42" rx="8" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="367" y="276" fill="#34d399" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">02:30 PM</text>

  <rect x="435" y="250" width="115" height="42" rx="8" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="492" y="276" fill="#34d399" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">04:00 PM</text>

  <rect x="560" y="250" width="115" height="42" rx="8" fill="#10b981" opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="617" y="276" fill="#34d399" font-family="'Inter', sans-serif" font-size="12" font-weight="600" text-anchor="middle">05:30 PM</text>

  <!-- Confirm Button -->
  <rect x="495" y="310" width="180" height="38" rx="8" fill="url(#violetCyan)"/>
  <text x="585" y="334" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="700" text-anchor="middle">Confirm Appointment &#8594;</text>
</svg>
