<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#162044"/>
      <stop offset="100%" stop-color="#0a0e1c"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="chartBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="28" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad2)"/>
  
  <!-- Glowing Orbs -->
  <circle cx="240" cy="180" r="150" fill="#38bdf8" opacity="0.1" filter="url(#glow2)"/>
  <circle cx="620" cy="280" r="170" fill="#818cf8" opacity="0.14" filter="url(#glow2)"/>

  <!-- Window Container -->
  <rect x="80" y="55" width="640" height="340" rx="16" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="80" y="55" width="640" height="42" rx="16" fill="rgba(30, 41, 59, 0.6)"/>
  <circle cx="110" cy="76" r="6" fill="#ef4444"/>
  <circle cx="130" cy="76" r="6" fill="#f59e0b"/>
  <circle cx="150" cy="76" r="6" fill="#10b981"/>
  <text x="400" y="81" fill="#94a3b8" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Data Analytics &amp; Statistical Visualization Dashboard</text>

  <!-- Metric Badges Row -->
  <g transform="translate(105, 115)">
    <!-- Metric 1 -->
    <rect x="0" y="0" width="130" height="55" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="rgba(255, 255, 255, 0.05)"/>
    <text x="12" y="22" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Total Records</text>
    <text x="12" y="44" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="16" font-weight="700">124,500</text>

    <!-- Metric 2 -->
    <rect x="145" y="0" width="130" height="55" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="rgba(255, 255, 255, 0.05)"/>
    <text x="157" y="22" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Cleaned Data</text>
    <text x="157" y="44" fill="#34d399" font-family="'Inter', sans-serif" font-size="16" font-weight="700">99.8%</text>

    <!-- Metric 3 -->
    <rect x="290" y="0" width="130" height="55" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="rgba(255, 255, 255, 0.05)"/>
    <text x="302" y="22" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Mean Variance</text>
    <text x="302" y="44" fill="#a78bfa" font-family="'Inter', sans-serif" font-size="16" font-weight="700">&plusmn; 0.024</text>

    <!-- Metric 4 -->
    <rect x="435" y="0" width="155" height="55" rx="8" fill="rgba(30, 41, 59, 0.5)" stroke="rgba(255, 255, 255, 0.05)"/>
    <text x="447" y="22" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Correlation Index</text>
    <text x="447" y="44" fill="#f43f5e" font-family="'Inter', sans-serif" font-size="16" font-weight="700">r = 0.89</text>
  </g>

  <!-- Charts Area -->
  <g transform="translate(105, 185)">
    <!-- Bar Chart Card -->
    <rect x="0" y="0" width="350" height="185" rx="10" fill="rgba(30, 41, 59, 0.4)" stroke="rgba(255, 255, 255, 0.05)"/>
    <text x="16" y="26" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Distribution Trends by Feature</text>
    
    <!-- Axes -->
    <line x1="30" y1="155" x2="330" y2="155" stroke="#334155" stroke-width="1.5"/>
    <line x1="30" y1="45" x2="30" y2="155" stroke="#334155" stroke-width="1.5"/>

    <!-- Bars -->
    <rect x="50" y="90" width="28" height="65" rx="4" fill="url(#chartBar)"/>
    <rect x="95" y="60" width="28" height="95" rx="4" fill="url(#chartBar)"/>
    <rect x="140" y="110" width="28" height="45" rx="4" fill="url(#chartBar)"/>
    <rect x="185" y="75" width="28" height="80" rx="4" fill="url(#chartBar)"/>
    <rect x="230" y="50" width="28" height="105" rx="4" fill="url(#chartBar)"/>
    <rect x="275" y="85" width="28" height="70" rx="4" fill="url(#chartBar)"/>

    <!-- Trend Line Card -->
    <rect x="365" y="0" width="225" height="185" rx="10" fill="rgba(30, 41, 59, 0.4)" stroke="rgba(255, 255, 255, 0.05)"/>
    <text x="381" y="26" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Regression Curve</text>
    
    <!-- Line chart path -->
    <path d="M 385 140 Q 425 125, 455 100 T 510 70 T 570 55" fill="none" stroke="#22d3ee" stroke-width="3"/>
    <circle cx="385" cy="140" r="4" fill="#38bdf8"/>
    <circle cx="455" cy="100" r="4" fill="#38bdf8"/>
    <circle cx="510" cy="70" r="4" fill="#38bdf8"/>
    <circle cx="570" cy="55" r="5" fill="#a855f7"/>

    <text x="381" y="168" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Model Confidence: 96.4%</text>
  </g>
</svg>
